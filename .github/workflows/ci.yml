name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Lint
        run: robocop check tests resources
      - name: Format check
        run: robocop format --check tests resources
      - name: Robot dry run
        run: python -m robot --dryrun --outputdir results tests/e2e
